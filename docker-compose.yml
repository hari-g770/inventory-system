version: "3.8"

services:
  app1:
    build: .
    container_name: finefix_app1
    restart: unless-stopped
    expose:
      - "3000"

  app2:
    build: .
    container_name: finefix_app2
    restart: unless-stopped
    expose:
      - "3000"

  app3:
    build: .
    container_name: finefix_app3
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    container_name: finefix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
