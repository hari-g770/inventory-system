worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream finefix_app {
        # Backend containers – adjust ports if you change the Docker compose file
        server app1:3000;
        server app2:3000;
        server app3:3000;

        # you can add more servers here, e.g. server app3:3000;
    }

    server {
        listen 80;
        # Uncomment and edit the following lines if you want HTTPS support
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # include /etc/nginx/snippets/ssl-params.conf;

        server_name _;   # replace with your domain if you have one

        # Serve static assets directly (optional – uncomment if you want Nginx to serve the built files instead of the node server)
        # root /usr/share/nginx/html;
        # try_files $uri $uri/ =404;

        location / {
            proxy_pass http://finefix_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
